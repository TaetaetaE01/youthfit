spring:
  application:
    name: youthfit

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youthfit}
    username: ${DB_USER:youthfit}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j.retry.calls: true

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-local-dev-minimum-32-bytes!!}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}   # 30분
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/auth/kakao/callback}

rag:
  hybrid:
    enabled: ${RAG_HYBRID_ENABLED:false}
    top-n-per-search: ${RAG_HYBRID_TOP_N:20}
    rrf-k: ${RAG_HYBRID_RRF_K:60}
    trigram-threshold: ${RAG_HYBRID_TRIGRAM_THRESHOLD:0.1}
  query-rewrite:
    enabled: ${RAG_QUERY_REWRITE_ENABLED:false}
    model: ${RAG_QUERY_REWRITE_MODEL:gpt-4o-mini}
    max-tokens: ${RAG_QUERY_REWRITE_MAX_TOKENS:80}
    temperature: ${RAG_QUERY_REWRITE_TEMPERATURE:0.3}
    timeout-ms: ${RAG_QUERY_REWRITE_TIMEOUT_MS:5000}

openai:
  embedding:
    api-key: ${OPENAI_API_KEY:}
    # 3-large 채택 근거(#167, 2026-07-03 평가셋 실측): 3-small 대비 recall@1 +7.4pp,
    # 정답-비정답 distance 갭 4.3배, 재보정 threshold 에서 근거없음 100% 차단. 단가 6.5배지만 절대액 미미(정책당 ~1원).
    # dimensions 는 1536 유지 — 변경 시 policy_document·qna_question_cache 의 vector(1536) 마이그레이션 필요.
    # 모델 변경 시 docs/runbooks/2026-07-04-embedding-model-change-runbook.md 절차(재인덱싱·캐시 무효화·threshold 재보정) 필수.
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
    dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
  chat:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_CHAT_MAX_TOKENS:2048}
  qna:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_QNA_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_QNA_MAX_TOKENS:1024}
  eligibility-rule:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_ELIGIBILITY_RULE_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_ELIGIBILITY_RULE_MAX_TOKENS:2000}
  ingestion:
    period:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_INGESTION_PERIOD_MODEL:gpt-4o-mini}
      max-tokens: ${OPENAI_INGESTION_PERIOD_MAX_TOKENS:128}
      max-body-chars: ${OPENAI_INGESTION_PERIOD_MAX_BODY_CHARS:3000}
    attachment-gate:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      max-tokens: 800
      max-preview-chars: 1500
  http:
    connect-timeout-seconds: ${OPENAI_HTTP_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${OPENAI_HTTP_READ_TIMEOUT_SECONDS:60}

youthfit:
  ingestion:
    health:
      payload-redact-days: 7
      failure-retention-days: 30
      stale-threshold-hours: 24
  metrics:
    llm-cost:
      bucket-retention-days: 90
      usd-to-krw: 1350
  internal:
    api-key: ${INTERNAL_API_KEY:}
  cost-guard:
    # 빈 값이면 전체 허용 (prod default). 채우면 해당 정책만 LLM/임베딩 호출 허용.
    policy-allowlist: ${POLICY_ALLOWLIST:}
  qna:
    cache-ttl-hours: ${QNA_CACHE_TTL_HOURS:24}
    # text-embedding-3-large 기준 cosine distance (#167 재보정, 2026-07-03 평가셋 threshold 스캔).
    # 0.48 에서 positive top-1 통과 94.4% / NEGATIVE(근거없음) 차단 100%. 3-large 는 분포가
    # 3-small 보다 전반적으로 낮아(정답 평균 0.351, 비정답 0.413) 구값 0.78 은 필터 역할을 못 함.
    # 모델을 바꾸면 이 값도 반드시 재보정 — 런북 참조.
    relevance-distance-threshold: ${QNA_RELEVANCE_DISTANCE_THRESHOLD:0.48}
    # 의미 캐시 히트 컷오프 (cosine distance). 한국어 단문은 표면 어휘 다양성에 임베딩이 매우 민감해
     # 의미 동일 질문도 0.4~0.55 분포가 흔함. 정책 prefix 시도(PR #60)는 의미 다른 단문까지 0.14~0.20 으로
     # 잡아당겨 false positive 가 발생해 되돌림. false positive 가 답변 정확도에 미치는 영향이 큰 만큼,
     # threshold 는 의미 동일 미세 변형(예: 부호/공백 차이)만 잡힐 정도로 보수적으로 운영.
     # 주의: 위 분포 실측은 3-small 기준 — 3-large 전환(#167)으로 질문쌍 distance 도 전반 하향됐을
     # 것으로 예상되므로 질의량이 붙으면 #166 에서 재실측·조정한다.
    semantic-distance-threshold: ${QNA_SEMANTIC_DISTANCE_THRESHOLD:0.20}
    cache:
      estimated-savings-per-hit-usd: ${QNA_CACHE_ESTIMATED_SAVINGS_PER_HIT_USD:0.0015}
      retention-days: ${QNA_CACHE_RETENTION_DAYS:90}
  rag:
    keyword-boost:
      enabled: ${RAG_KEYWORD_BOOST_ENABLED:true}
      max-keywords: ${RAG_KEYWORD_BOOST_MAX_KEYWORDS:5}
      stopwords:
        - 뭐
        - 무엇
        - 어떤
        - 어떻게
        - 얼마
        - 언제
        - 어디
        - 어디서
        - 누구
        - 가능
        - 필요
        - 알려줘
        - 정보
        - 내용
  email:
    transport: ${EMAIL_TRANSPORT:logging}
    from:
      address: ${MAIL_FROM_ADDRESS:}
      name:    ${MAIL_FROM_NAME:YouthFit}
    base-url: ${MAIL_BASE_URL:http://localhost:5173}
    attempt:
      retention-days: ${YOUTHFIT_EMAIL_ATTEMPT_RETENTION_DAYS:90}
    ses:
      region:            ${AWS_SES_REGION:ap-northeast-2}
      access-key-id:     ${AWS_SES_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SES_SECRET_ACCESS_KEY:}

n8n:
  force-enrich-webhook-url: ${N8N_FORCE_ENRICH_WEBHOOK_URL:http://localhost:5678/webhook/force-enrich}

enrichment:
  timeout:
    fixed-delay-ms: 60000

admin:
  dashboard:
    llm:
      weekly-budget-krw: 100000
      daily-spike-multiplier: 1.5
    ingestion:
      stale-days: 7
    enrichment:
      backlog-warn: 20
    email:
      failure-rate-threshold: 0.05
      failure-count-threshold: 10
    qna-cache:
      hit-drop-threshold-pp: 10
    policy-intake:
      stall-ratio: 0.3
    scheduled-tasks:
      stale-hours: 24

attachment:
  storage:
    type: ${ATTACHMENT_STORAGE_TYPE:local}
    local-path: ${ATTACHMENT_STORAGE_LOCAL_PATH:/data/attachments}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:ap-northeast-2}
      access-key-id: ${S3_ACCESS_KEY_ID:}
      secret-access-key: ${S3_SECRET_ACCESS_KEY:}
      # 환경별 키 격리용 prefix. 예: local, dev, prod. 빈 값이면 기존 키 패턴 그대로.
      key-prefix: ${S3_KEY_PREFIX:}
  download:
    connect-timeout-seconds: ${ATTACHMENT_DOWNLOAD_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${ATTACHMENT_DOWNLOAD_READ_TIMEOUT_SECONDS:60}
    max-size-mb: ${ATTACHMENT_DOWNLOAD_MAX_SIZE_MB:50}
  extraction:
    min-text-chars: ${ATTACHMENT_EXTRACTION_MIN_TEXT_CHARS:100}
    retry-limit: ${ATTACHMENT_EXTRACTION_RETRY_LIMIT:3}
  reindex:
    max-content-kb: ${ATTACHMENT_REINDEX_MAX_CONTENT_KB:200}
  scheduler:
    fixed-delay-ms: ${ATTACHMENT_SCHEDULER_FIXED_DELAY_MS:60000}
    batch-size: ${ATTACHMENT_SCHEDULER_BATCH_SIZE:20}

resilience4j:
  retry:
    instances:
      openai-chat:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - com.youthfit.common.exception.RetryableOpenAiException
      openai-embedding:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - com.youthfit.common.exception.RetryableOpenAiException
      openai-qna:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - com.youthfit.common.exception.RetryableOpenAiException

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youthfit}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.youthfit: DEBUG
    org.springframework.security: DEBUG

attachment:
  storage:
    local-path: /tmp/youthfit-attachments

youthfit:
  cost-guard:
    # local 기본: 빈 값 = 전체 허용 (prod 와 동일). 토큰 절약 필요 시 .env 에 POLICY_ALLOWLIST=7,30 식으로 명시.
    policy-allowlist: ${POLICY_ALLOWLIST:}
  email:
    transport: ${EMAIL_TRANSPORT:logging}

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.youthfit: INFO

youthfit:
  email:
    transport: ${EMAIL_TRANSPORT:ses}
